name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # Sigstore signing for build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build source archive + SHA-256 checksums (from the tagged commit, by CI)
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="clipwarden-${GITHUB_REF_NAME}/" -o "dist/clipwarden-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_REF_NAME}"
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" \
            --notes "To verify, run sha256sum -c SHA256SUMS, then gh attestation verify FILE -R ${GITHUB_REPOSITORY}"
