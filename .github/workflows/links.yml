name: links
on:
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lychee:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every link in the docs and bibliography still resolves
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 3 --exclude "example\.(com|org|net)" --exclude "127\.0\.0\.1" --exclude "affiliate-program\.amazon\.com" --exclude "/studio/" README.md docs/ site/
          fail: true
