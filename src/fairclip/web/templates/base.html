<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}fair-clip{% endblock %} · fair-clip</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/favicon.png">
<meta name="theme-color" content="#0B1020">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><span class="shield" aria-hidden="true">◈</span> fair-clip</a>
  {% if user %}
  <nav>
    <a href="/studio/"><b>Studio</b></a><a href="/">Pipeline</a><a href="/audit">Audit log</a><a href="/affiliate">Affiliate</a><a href="/analytics">Analytics</a><a href="/settings">Settings</a>
  </nav>
  <div class="pills">
    <span class="pill {{ 'pill-live' if live else 'pill-dry' }}" title="publish mode">{{ 'LIVE' if live else 'DRY-RUN' }}</span>
    {% if kill %}<span class="pill pill-kill" title="kill switch engaged">■ KILL SWITCH ON</span>{% endif %}
    <form method="post" action="/logout" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="linkish">Log out</button></form>
  </div>
  {% endif %}
</header>
<main>
{% block body %}{% endblock %}
</main>
<footer class="foot">Automate the labor, never the judgment. · {{ channel }} · bound to localhost</footer>
</body>
</html>
