<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Security boundary diagram: what runs sandboxed, where tokens live, and what reaches Google" font-family="DejaVu Sans, Verdana, Segoe UI, sans-serif"><title>Security boundary diagram: what runs sandboxed, where tokens live, and what reaches Google</title><rect width="1200" height="700" rx="16" fill="#0B1020"/><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8ECF4"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"/></marker></defs><rect x="16" y="30" width="176" height="640" rx="18" fill="none" stroke="#F87171" stroke-width="2.5" stroke-dasharray="8 6"/><text x="34" y="60" font-size="18" font-weight="800" fill="#E8ECF4">Untrusted</text><text x="34" y="81" font-size="12.5" fill="#9AA4B8">treated as data, never</text><text x="34" y="98" font-size="12.5" fill="#9AA4B8">as instructions</text><rect x="208" y="30" width="640" height="640" rx="18" fill="none" stroke="#E8ECF4" stroke-width="2.5"/><text x="226" y="60" font-size="18" font-weight="800" fill="#E8ECF4">Your computer</text><text x="226" y="81" font-size="12.5" fill="#9AA4B8">no inbound ports · dashboard on 127.0.0.1 only</text><rect x="866" y="30" width="318" height="640" rx="18" fill="#0D302D" stroke="#2DD4BF" stroke-width="2.5"/><text x="884" y="60" font-size="18" font-weight="800" fill="#E8ECF4">Google</text><text x="884" y="81" font-size="12.5" fill="#9AA4B8">your own Cloud project per deployment</text><rect x="230" y="100" width="290" height="150" rx="12" fill="#121A2E" stroke="#3A4868" stroke-width="2"/><text x="244" y="126" font-size="16" font-weight="700" fill="#E8ECF4">Pipeline + gate</text><text x="244" y="149" font-size="13" fill="#9AA4B8">strict schemas: unknown = reject</text><text x="244" y="168" font-size="13" fill="#9AA4B8">model output = untrusted data</text><text x="244" y="187" font-size="13" fill="#9AA4B8">links must match the allowlist</text><text x="244" y="206" font-size="13" fill="#9AA4B8">injection phrases flagged</text><text x="244" y="225" font-size="13" fill="#9AA4B8">approval binds file + metadata hash</text><rect x="230" y="276" width="290" height="320" rx="14" fill="#251B47" stroke="#A78BFA" stroke-width="2.5" stroke-dasharray="9 6"/><text x="246" y="304" font-size="16" font-weight="800" fill="#A78BFA">Media sandbox (Docker)</text><text x="246" y="330" font-size="13" fill="#E8ECF4">no network (--network none)</text><text x="246" y="350" font-size="13" fill="#E8ECF4">read-only root, all caps dropped</text><text x="246" y="370" font-size="13" fill="#E8ECF4">no-new-privileges, non-root user</text><text x="246" y="390" font-size="13" fill="#E8ECF4">memory / CPU / process limits</text><text x="246" y="410" font-size="13" fill="#E8ECF4">one job folder, inputs read-only</text><text x="246" y="430" font-size="13" fill="#E8ECF4">FFmpeg: file protocol only</text><rect x="250" y="472" width="250" height="50" rx="12" fill="#121A2E" stroke="#A78BFA" stroke-width="2"/><text x="264" y="498" font-size="15" font-weight="700" fill="#E8ECF4">FFmpeg · FFprobe</text><text x="246" y="550" font-size="12.5" fill="#9AA4B8">outputs are hashed (SHA-256) before</text><text x="246" y="568" font-size="12.5" fill="#9AA4B8">anything else trusts them</text><rect x="540" y="100" width="290" height="130" rx="12" fill="#121A2E" stroke="#3A4868" stroke-width="2"/><text x="554" y="126" font-size="16" font-weight="700" fill="#E8ECF4">Dashboard (FastAPI)</text><text x="554" y="149" font-size="13" fill="#9AA4B8">Host-header allowlist (anti-rebinding)</text><text x="554" y="168" font-size="13" fill="#9AA4B8">password (scrypt) + signed cookie</text><text x="554" y="187" font-size="13" fill="#9AA4B8">CSRF token on every POST</text><text x="554" y="206" font-size="13" fill="#9AA4B8">strict CSP, no inline script</text><rect x="540" y="246" width="290" height="112" rx="12" fill="#121A2E" stroke="#FFB000" stroke-width="2"/><text x="554" y="272" font-size="16" font-weight="700" fill="#E8ECF4">🔒 Token vault</text><text x="554" y="295" font-size="13" fill="#9AA4B8">OS keychain, or AES-GCM file</text><text x="554" y="314" font-size="13" fill="#9AA4B8">key = scrypt(passphrase)</text><text x="554" y="333" font-size="13" fill="#9AA4B8">never logged · revocable</text><rect x="540" y="374" width="290" height="130" rx="12" fill="#121A2E" stroke="#3A4868" stroke-width="2"/><text x="554" y="400" font-size="16" font-weight="700" fill="#E8ECF4">State + audit log</text><text x="554" y="423" font-size="13" fill="#9AA4B8">SQLite, content-addressed media</text><text x="554" y="442" font-size="13" fill="#9AA4B8">append-only, hash-chained log</text><text x="554" y="461" font-size="13" fill="#9AA4B8">UPDATE/DELETE refused by triggers</text><text x="554" y="480" font-size="13" fill="#9AA4B8">dry-run by default, kill switch</text><rect x="540" y="520" width="290" height="76" rx="12" fill="#121A2E" stroke="#3A4868" stroke-width="2"/><text x="554" y="546" font-size="14" font-weight="700" fill="#E8ECF4">Optional local LLM (127.0.0.1)</text><text x="554" y="569" font-size="13" fill="#9AA4B8">proposes text only; cannot act</text><text x="228" y="640" font-size="13" fill="#9AA4B8">Approve/reject happens here, by a person. Nothing public without it.</text><text x="34" y="150" font-size="14" font-weight="700" fill="#F87171">Transcript text</text><text x="34" y="186" font-size="12" fill="#9AA4B8">what was said</text><path d="M34,164 H226" stroke="#F87171" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#r)"/><text x="34" y="226" font-size="14" font-weight="700" fill="#F87171">Comments</text><text x="34" y="262" font-size="12" fill="#9AA4B8">(future milestone)</text><path d="M34,240 H226" stroke="#F87171" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#r)"/><text x="34" y="491" font-size="14" font-weight="700" fill="#F87171">Source video file</text><text x="34" y="527" font-size="12" fill="#9AA4B8">magic bytes checked first</text><path d="M34,505 H246" stroke="#F87171" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#r)"/><rect x="886" y="100" width="280" height="130" rx="12" fill="#121A2E" stroke="#2DD4BF" stroke-width="2"/><text x="900" y="126" font-size="16" font-weight="700" fill="#E8ECF4">OAuth 2.0 sign-in</text><text x="900" y="149" font-size="13" fill="#9AA4B8">installed-app flow, loopback</text><text x="900" y="168" font-size="13" fill="#9AA4B8">PKCE (S256) + state check</text><text x="900" y="187" font-size="13" fill="#9AA4B8">one scope: youtube.upload</text><rect x="886" y="300" width="280" height="150" rx="12" fill="#121A2E" stroke="#2DD4BF" stroke-width="2"/><text x="900" y="326" font-size="16" font-weight="700" fill="#E8ECF4">YouTube Data API v3</text><text x="900" y="349" font-size="13" fill="#9AA4B8">videos.insert, only after approval</text><text x="900" y="368" font-size="13" fill="#9AA4B8">privacy + publishAt in the</text><text x="900" y="387" font-size="13" fill="#9AA4B8">same call: no broad &#x27;manage</text><text x="900" y="406" font-size="13" fill="#9AA4B8">account&#x27; scope ever needed</text><rect x="886" y="486" width="280" height="110" rx="12" fill="#121A2E" stroke="#2DD4BF" stroke-width="2"/><text x="900" y="512" font-size="16" font-weight="700" fill="#E8ECF4">YouTube Analytics</text><text x="900" y="535" font-size="13" fill="#9AA4B8">read-only scope, opt-in</text><text x="900" y="554" font-size="13" fill="#9AA4B8">(milestone 2)</text><path d="M830,160 H882" stroke="#2DD4BF" stroke-width="2.5" fill="none" marker-end="url(#t)"/><path d="M830,300 C858,300 858,215 882,215" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="3 4" fill="none" marker-end="url(#t)"/><path d="M830,430 C858,430 858,375 882,375" stroke="#E8ECF4" stroke-width="3.5" fill="none" marker-end="url(#m)"/><path d="M886,541 C850,541 858,470 834,470" stroke="#2DD4BF" stroke-width="2" fill="none" marker-end="url(#t)"/><text x="886" y="268" font-size="12.5" fill="#2DD4BF">⇠ refresh token goes only to Google’s</text><text x="886" y="285" font-size="12.5" fill="#2DD4BF">   token endpoint, over HTTPS</text><text x="886" y="470" font-size="12.5" font-weight="700" fill="#E8ECF4">⇠ the approved clip + its exact metadata</text><text x="886" y="620" font-size="12.5" fill="#9AA4B8">⇢ retention numbers come back read-only</text><line x1="34" y1="610" x2="80" y2="610" stroke="#F87171" stroke-width="2.5" stroke-dasharray="7 5"/><text x="88" y="614" font-size="12" fill="#9AA4B8">untrusted</text><line x1="34" y1="634" x2="80" y2="634" stroke="#A78BFA" stroke-width="2.5" stroke-dasharray="9 6"/><text x="88" y="638" font-size="12" fill="#9AA4B8">isolation</text><line x1="34" y1="658" x2="80" y2="658" stroke="#2DD4BF" stroke-width="2.5"/><text x="88" y="662" font-size="12" fill="#9AA4B8">to/from Google</text></svg>